<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0d0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Night Shift">
<link rel="apple-touch-icon" href="images/icon-180.png">
<title>NIGHT SHIFT — Facilities Monitoring</title>

<!--
================================================================================
  NIGHT SHIFT  —  build 2, "no doors"
================================================================================

  Runs with zero images. Missing files become labeled placeholders naming the
  exact filename they wanted, so you can tune mechanics now and shoot later.

  WHAT CHANGED FROM BUILD 1
    Doors and the power meter are gone. Power is now a binary switch whose only
    cost is blindness. Defense is influence — audio lures — plus one desperate
    last resort. Two roamers instead of four.

  THE THREE THINGS YOU EDIT
    GRAPH    — rooms and how they connect. Coordinates are % of the floorplan.
    CAMERAS  — which nodes each camera can see, and its photo.
    NIGHTS   — difficulty curve.

  IMAGES
    images/floorplan.png       your sketch, cleaned up (optional, shows on map)
    images/office.jpg          wide panorama from your desk
    images/cam_XX.jpg          one per camera, panoramas
    images/ani_warden.png      transparent PNG per animatronic
    images/scare_warden.jpg    its jumpscare frame

================================================================================
-->

<style>
:root{
  --phos:#7dfab0;
  --phos-dim:#63b98e;   /* idle button text — was #2f6b4c and barely legible */
  --amber:#ffc766; --alarm:#ff5f52;
  --shell:#0a0d0b;
  --hair:#3a5147;       /* borders — the old #1e2a22 vanished against the shell */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%; background:var(--shell); color:var(--phos);
  font-family:"SF Mono","JetBrains Mono",Consolas,"Courier New",monospace;
  overflow:hidden; user-select:none; -webkit-user-select:none;
  /* Chrome inflates the font size of text-heavy blocks on phones unless told
     not to. That is what made the title screen unreadably large. */
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
}
button{font:inherit}

#stage{position:relative; width:100vw; height:100vh; height:100dvh;
  overflow:hidden; background:#000}

/* THE CRT SITS ON THE PICTURE, NOT ON THE INTERFACE.

   Its vignette is a heavy multiply — transparent at the middle of the screen,
   85% black at the edges. At z-index 60 it was painted over everything,
   including the maintenance panel and the floorplan, so a row of text near the
   top or bottom of either came out visibly darker than the same text in the
   middle of the screen. Nothing was wrong with the text; it was being graded
   like part of the photograph.

   It now sits above the office (z10) and the feed (z20) and below every piece
   of interface: the monitor's own controls (z42), the HUD (z40), the docks
   (z45) and the panel (z48). Scanlines and vignette on the imagery, none on
   anything you have to read. */
#crt{
  position:absolute; inset:0; z-index:30; pointer-events:none;
  background:
    repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.28) 3px 4px),
    radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.85) 100%);
  mix-blend-mode:multiply;
}

/* ---- office ------------------------------------------------------------ */
#officeView{position:absolute; inset:0; z-index:10; transition:filter .3s}
/* THE OFFICE SCENE IS THE SHAPE OF THE PHOTOGRAPH.

   The doorway box is a percentage of this element, so if this element's shape
   follows the browser window then the box's shape does too — and a sprite sized
   by width with height:auto lands at a different height on every monitor. The
   aspect ratio is set from the panorama itself once it loads, so the tool and
   the game are measuring the same rectangle. min-width keeps it covering the
   screen on windows wider than the photo. */
#officeScene{
  position:absolute; top:0; left:0; height:100%;
  width:auto; min-width:100%; aspect-ratio:3064/1015;
  transition:transform .18s cubic-bezier(.2,.7,.3,1); will-change:transform;
}
#officeArt{position:absolute; inset:0}
#officeArt img{width:100%; height:100%; object-fit:fill; display:block;
  filter:var(--grade-office)}

/* Filters land on the PHOTO layer only. The figures in the doorways get their
   own treatment, otherwise cutting the power would hide the one thing the
   player still needs to be able to see. */
/* Power cut. The room is still the room — the photo stays visible under a blue
   veil instead of being crushed to black, so a figure in a doorway and the
   walk-by animation both still read. */
body.dark #officeArt img{filter:brightness(.30) contrast(1.35) saturate(.16) hue-rotate(-14deg)}
#darkVeil{
  position:absolute; inset:0; z-index:4; pointer-events:none;
  background:linear-gradient(180deg, rgba(6,12,20,.70), rgba(3,6,10,.84));
  opacity:0; transition:opacity .45s;
}
body.dark #darkVeil{opacity:1}
body.ventbad #officeArt img{filter:var(--grade-office) blur(1.3px) saturate(.2)}
body.dark.ventbad #officeArt img{filter:brightness(.30) blur(1.5px) saturate(.10) contrast(1.4)}

/* ---- the doorway ---------------------------------------------------------
   Anchored to the actual door in the office panorama rather than the screen
   edges, so figures appear where a body could physically be. Set by
   --door-x / --door-w / --door-top / --door-h from OFFICE_DOOR in the config.
   The box clips, so only the part of them clearing the frame is visible. */
.doorway{
  position:absolute;
  left:var(--door-x); width:var(--door-w);
  top:var(--door-top); height:var(--door-h);
  overflow:hidden; pointer-events:none; z-index:3;
}

/* Placement comes from DOOR_SHOTS, set inline, so it can be dialled in with
   the calibration tool like everything else. The transform is reserved for
   mirroring and for the walk-by, or the two would fight. */
.lurker{
  position:absolute; height:auto;
  object-fit:contain; object-position:bottom center;
  opacity:0; transition:opacity .4s ease;
  filter:brightness(.5) contrast(1.45) saturate(.3);
}
.doorway.right .lurker{transform:scaleX(-1)}
.doorway.present .lurker{opacity:.95}

/* In the dark they read as a silhouette rather than a lit figure. No glow:
   nothing in an unlit office emits light, and a halo around the one thing you
   are trying to make out turns it into a marker for itself. Brightness and
   contrast do the work — you find the shape against the room, or you do not. */
body.dark .lurker{
  filter:brightness(.42) contrast(2.2) saturate(0);
}
body.dark .doorway.present .lurker{opacity:.95}

/* the pass-by: they cross the opening and keep going */
.doorway.walkby .lurker{
  opacity:.92;
  animation:crossLeft var(--walkMs,2600ms) cubic-bezier(.35,0,.55,1) forwards;
}
.doorway.right.walkby .lurker{animation-name:crossRight}
/* They set off from exactly where they were standing rather than sliding in
   from off-frame — the old version blinked out for a moment first, which read
   as a glitch rather than as something walking away. */
@keyframes crossLeft{
  0%  {transform:translateX(0);     opacity:.95}
  65% {opacity:.95}
  100%{transform:translateX(190%);  opacity:0}
}
@keyframes crossRight{
  0%  {transform:translateX(0) scaleX(-1);     opacity:.95}
  65% {opacity:.95}
  100%{transform:translateX(-190%) scaleX(-1); opacity:0}
}

/* No glow. A figure in the doorway is the only signal — if you cannot see it,
   that is the game working. */

/* ---- monitor ----------------------------------------------------------- */
/* The monitor is always in the DOM and slides up from the bottom edge, the way
   a hinged panel would. Coming up is fast and slightly overshooting; going down
   is quicker still, because dropping it is usually a panic. */
#monitor{
  position:absolute; inset:0; z-index:20; background:#000;
  transform:translateY(101%) scale(.985); opacity:0; pointer-events:none;
  transition:transform .16s cubic-bezier(.4,0,.7,.4), opacity .12s linear;
  will-change:transform;
}
#monitor.up{
  transform:translateY(0) scale(1); opacity:1; pointer-events:auto;
  transition:transform .26s cubic-bezier(.2,.9,.3,1.06), opacity .13s linear;
}
/* a burst of snow as it settles */
#monitor.up #static{animation:jitter .09s steps(3) infinite, settle .4s ease-out}
@keyframes settle{0%{opacity:.85}100%{opacity:.14}}
/* THE FEED HAS A FIXED SHAPE.

   Sprite sizes are percentages of the pan wrapper, and that wrapper used to be
   a percentage of the browser WINDOW — so identical numbers rendered about 15%
   larger in a maximised window than in the calibration tool, which assumes
   16:9. The feed is now letterboxed to one canonical shape, so a placement
   means the same thing everywhere and the tool is honestly WYSIWYG. It also
   reads more like a monitor showing footage than a photo stretched to fit. */
#camFeed{position:absolute; inset:0; overflow:hidden; background:#000;
  display:flex; align-items:center; justify-content:center}
#camBox{position:relative; overflow:hidden; aspect-ratio:16/9; height:100%; width:auto}
@media (max-aspect-ratio:16/9){ #camBox{width:100%; height:auto} }
#camPan{position:absolute; top:0; left:0; height:100%; width:130%; will-change:transform}
#camArt{position:absolute; inset:0}
/* NIGHT GRADE — these photos were shot in daylight. Until they're reshot in
   the dark, everything gets pushed down here. One place to change, and
   deleting the two --grade lines restores the originals. */
:root{
  --grade-cam:    brightness(.50) contrast(1.22) saturate(.40) hue-rotate(-10deg);
  --grade-office: brightness(.56) contrast(1.16) saturate(.46) hue-rotate(-10deg);
}
#camPan img.feed{width:100%;height:100%;object-fit:cover;
  filter:grayscale(.5) var(--grade-cam)}
#camPan .subject{position:absolute; object-fit:contain; object-position:bottom center;
  filter:grayscale(.6) contrast(1.1) brightness(.65)}

/* something that was not there. Fades up, holds, fades out. */
#camPan .subject.phantom{pointer-events:none; opacity:0;
  animation:phantom 1.15s ease-in-out forwards}
@keyframes phantom{
  0%{opacity:0}
  22%{opacity:.62}
  62%{opacity:.62}
  100%{opacity:0}
}

/* Figures beside your door still get the .atdoor class, so a rule can be hung
   on it later. It carries no styling of its own — position and scale do the
   telling now. */

/* THE PHANTOM ON THE FEED.

   He sits in the FRAME rather than in the panorama: he does not drift with the
   camera sweep the way a body standing in a room does, because he is not in
   the room. He is on the lens. Low and wide and much too close, filling the
   bottom of the picture — the shape reads in a fraction of a second, which is
   all the notice you get. */
#phantomArt{
  position:absolute; left:50%; bottom:-6%; transform:translateX(-50%);
  height:74%; width:auto; z-index:4; pointer-events:none;
  filter:grayscale(.75) contrast(1.3) brightness(.55);
  opacity:0; transition:opacity .1s linear;
}
#phantomArt.on{opacity:.93}
/* he is on the picture, so anything that kills the picture kills him too */
body.camdown #phantomArt, body.transit #phantomArt{opacity:0}

#static{position:absolute; inset:0; opacity:.14; pointer-events:none;
  background-image:var(--noise); background-size:180px 180px; animation:jitter .09s steps(3) infinite}
@keyframes jitter{0%{background-position:0 0}33%{background-position:37px -21px}
  66%{background-position:-19px 44px}100%{background-position:11px 8px}}

/* camera system down: nothing but snow */
#camDead{position:absolute; inset:0; display:none; align-items:center; justify-content:center;
  background:#050705; z-index:2; font-size:12px; letter-spacing:.22em; color:var(--alarm)}
body.camdown #camDead{display:flex}
body.camdown #camBox{opacity:.06}
body.camdown #static{opacity:.5}

#camLabel{position:absolute; left:22px; bottom:22px; z-index:3; font-size:13px; letter-spacing:.16em}
#camLabel .rec{color:var(--alarm); margin-right:10px; animation:blink 1.6s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

#sensorBtn{
  position:absolute; left:22px; bottom:100px; z-index:5; pointer-events:auto;
  padding:12px 18px; font-size:11px; letter-spacing:.18em; cursor:pointer;
  color:#8fe0b4; background:rgba(6,10,7,.94); border:1px solid #46614f;
}
#sensorBtn:hover:not(:disabled){color:var(--phos); border-color:var(--phos-dim)}
#sensorBtn:disabled{opacity:.32; cursor:not-allowed}
#sensorBtn.engaged{color:var(--shell); background:var(--amber); border-color:var(--amber)}

#audioBtn{
  position:absolute; left:22px; bottom:58px; z-index:5; pointer-events:auto;
  padding:12px 18px; font-size:11px; letter-spacing:.18em; cursor:pointer;
  color:#8fe0b4; background:rgba(6,10,7,.94); border:1px solid #46614f;
}
#audioBtn:hover:not(:disabled){color:var(--phos); border-color:var(--phos-dim)}
#audioBtn:disabled{opacity:.32; cursor:not-allowed}
#audioBtn.firing{color:var(--shell); background:var(--amber); border-color:var(--amber)}

/* ---- the monitor's own controls ------------------------------------------
   These sit OUTSIDE #monitor, in their own layer above the CRT, because the
   vignette is a grade for the footage and not for the interface. The monitor
   is a stacking context of its own, so nothing inside it can ever rise above
   the CRT — the controls have to live out here to be lit evenly.

   Geometry is unchanged: #monUI covers the same rectangle #monitor does, so
   every left/right/bottom offset means what it always meant. It carries the
   monitor's slide so they still arrive together, and nothing in it is
   clickable unless the monitor is actually up. */
#monUI{
  position:absolute; inset:0; z-index:42; pointer-events:none;
  opacity:0; transform:translateY(2%);
  transition:transform .16s cubic-bezier(.4,0,.7,.4), opacity .12s linear;
}
body.camsup #monUI{
  opacity:1; transform:translateY(0);
  transition:transform .26s cubic-bezier(.2,.9,.3,1.06), opacity .13s linear;
}
#monUI > *{pointer-events:none}
body.camsup #monUI > *{pointer-events:auto}

/* ---- floorplan --------------------------------------------------------- */
/* No frame, no caption. The floorplan floats over the feed and you can see
   through it, because it is a thing you glance at rather than read. */
#map{position:absolute; right:20px; bottom:20px; z-index:4; width:min(390px,44vw);
  padding:0; background:none; border:none}
#map h4{font-size:10px; font-weight:400; letter-spacing:.28em; color:#8fe0b4; margin-bottom:9px}
#mapPlan{position:relative; width:100%; aspect-ratio:662/776;
  border:1px solid rgba(70,97,79,.5); background-color:rgba(6,10,7,.3);
  background-image:var(--plan,none); background-size:contain;
  background-repeat:no-repeat; background-position:center}
/* No floorplan drawing supplied. The hatching that used to fill the gap was
   solid, which quietly cancelled the panel's transparency — and it is redundant
   now that the rooms themselves are drawn. What is left is a whisper of texture
   you can still see straight through. */
#mapPlan.noplan{background-image:repeating-linear-gradient(45deg,
  rgba(125,250,176,.035) 0 9px, transparent 9px 18px)}
/* the rooms, drawn behind the buttons */
.room{position:absolute; border:1px solid rgba(160,182,170,.38); pointer-events:none}
.room.hall{background:rgba(70,110,150,.08); border-color:rgba(110,160,210,.26)}
.room.you{background:rgba(250,220,40,.16); border-color:var(--amber); border-width:2px}
.room.lit{background:rgba(125,250,176,.14); border-color:rgba(125,250,176,.55)}
.room i{position:absolute; left:3px; top:2px; font-style:normal;
  font-size:8px; letter-spacing:.05em; color:rgba(190,212,200,.85);
  text-shadow:0 1px 2px rgba(0,0,0,.9)}
.room.you i{color:var(--amber)}

.camPin{position:absolute; transform:translate(-50%,-50%); min-width:42px; padding:7px 8px;
  font-size:11px; letter-spacing:.04em; cursor:pointer; text-align:center; z-index:2;
  color:#8fe0b4; background:rgba(6,10,7,.72); border:1px solid #46614f;
  text-shadow:0 1px 2px rgba(0,0,0,.8)}
.camPin:hover{color:var(--phos); border-color:var(--phos-dim)}
.camPin.active{color:var(--shell); background:var(--phos); border-color:var(--phos)}
.camPin.sensor{border-color:var(--amber); color:var(--amber); box-shadow:0 0 0 1px var(--amber) inset}
.camPin.lured{border-color:var(--amber); color:var(--amber)}

/* something is standing beside your door, seen from inside the office */
/* No red anywhere. Something standing in a doorway is the signal; a warning
   light on top of it just tells you what you can already see. */
@keyframes doorPulse{0%,100%{opacity:.42} 50%{opacity:1}}

/* on a feed, anything standing in a kill square is ringed in red */
.subject.imminent{animation:imminentPulse 1.15s ease-in-out infinite}
@keyframes imminentPulse{0%,100%{opacity:.82} 50%{opacity:1}}

/* the Warden just moved. Every feed stutters for a fifth of a second. */
body.flicker #camFeed{opacity:.28; filter:brightness(1.5) contrast(.7)}
body.flicker #static{opacity:.55}
body.flicker #camLabel{opacity:.4}

/* Something is crossing a doorway: every feed drops to snow until it lands. */
body.transit #camBox{opacity:.04}
body.transit #static{opacity:.78}
body.transit #camLabel{color:var(--alarm)}
body.transit .subject{display:none}

/* a failing camera: the picture comes and goes */
body.dropout #camBox{opacity:.05}
body.dropout #static{opacity:.62}
body.dropout #camLabel{color:var(--alarm)}

/* the seconds before it reaches you */
body.doom #monitor{animation:doomShake .09s steps(2) infinite}
body.doom #static{opacity:.42}
@keyframes doomShake{
  0%{transform:translate(0,0)} 50%{transform:translate(-3px,2px)} 100%{transform:translate(2px,-2px)}
}

/* face-down on the floor */
#outOverlay{position:absolute; inset:0; z-index:58; background:#000; opacity:0;
  pointer-events:none; transition:opacity .55s}
body.out #outOverlay{opacity:1; pointer-events:auto}

#alerts div.ok{color:var(--amber)}

/* ---- systems panel ----------------------------------------------------- */
/* Back in the office where it started. The Auditor already makes looking away
   expensive, so the panel does not also need to cost you the feed. */
#panel{position:absolute; top:0; right:0; bottom:0; width:min(400px,88vw); z-index:48;
  background:#070b08; border-left:1px solid var(--hair); padding:26px 22px;
  transform:translateX(101%); transition:transform .22s cubic-bezier(.3,.9,.3,1);
  overflow-y:auto}
body.paneltab #panel{transform:translateX(0)}

/* the tab you reach for, and the strip on the right that opens it */
body.paneltab #monBtn{opacity:0; pointer-events:none}
body.camsup #panelBtn{opacity:0; pointer-events:none}
#panel h3{font-size:11px; font-weight:400; letter-spacing:.3em; color:#8fe0b4; margin-bottom:22px}
.sysRow{border:1px solid #46614f; padding:14px; margin-bottom:12px;
  background:rgba(125,250,176,.035)}
.sysHead{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:9px}
.sysName{font-size:11px; letter-spacing:.18em}
.sysState{font-size:10px; letter-spacing:.14em; color:var(--phos)}
.sysRow.bad .sysState{color:var(--alarm)}
.sysRow.busy .sysState{color:var(--amber)}
.rebootBtn{width:100%; padding:11px; font-size:11px; letter-spacing:.18em; cursor:pointer;
  color:#8fe0b4; background:rgba(125,250,176,.05); border:1px solid #46614f;
  transition:color .12s, border-color .12s, background .12s}
.rebootBtn:hover:not(:disabled){color:var(--phos); border-color:var(--phos-dim)}
.rebootBtn:disabled{opacity:.3; cursor:not-allowed}
/* A faulted system lights its own button. The state line already says FAULT,
   but the panel is read at a glance in the dark and colour carries further
   than a word does — you should know which row to hit before you have read
   any of them. */
.sysRow.bad .rebootBtn{color:#ffb3ac; border-color:var(--alarm);
  background:rgba(255,95,82,.10)}
.sysRow.bad .rebootBtn:hover:not(:disabled){color:#fff1ef; border-color:#ff8b80;
  background:rgba(255,95,82,.20)}
.bar{height:3px; background:#152018; margin-top:9px}
.bar i{display:block; height:100%; background:var(--amber); width:0}
#rebootAll{margin-top:6px; border-color:var(--phos-dim); color:var(--phos)}

/* The strip at the bottom you reach into to raise the monitor, and the one on
   the right that opens the panel. Both are invisible until the cursor nears
   them, so the office stays uncluttered. */
#pullTab{
  position:absolute; left:0; right:0; bottom:0; height:5%; z-index:44;
  pointer-events:none; opacity:0; transition:opacity .2s;
  background:linear-gradient(0deg, rgba(125,250,176,.16), transparent 85%);
  display:flex; align-items:flex-end; justify-content:center; padding-bottom:6px;
}
#pullTab span{font-size:13px; color:var(--phos); letter-spacing:.4em}
body.nearBottom #pullTab{opacity:1}
body.camsup #pullTab{opacity:0}

#panel::before{
  content:""; position:absolute; left:-14px; top:0; bottom:0; width:14px;
  background:linear-gradient(270deg, rgba(125,250,176,.14), transparent);
  opacity:0; transition:opacity .2s;
}
body.nearRight #panel::before{opacity:1}

/* while a reboot is running you are pinned to the panel */
#panel.held{border-left:2px solid var(--amber)}


/* ---- HUD --------------------------------------------------------------- */
#hud{position:absolute; inset:0; z-index:40; pointer-events:none}
#clock{position:absolute; top:18px; right:26px; font-size:30px; letter-spacing:.04em; line-height:1}
#clock small{display:block; font-size:9px; letter-spacing:.3em; color:var(--phos-dim); margin-top:6px; text-align:right}
/* Real seconds, under the hour that is not made of them. The clock face moves
   once every 45 seconds and tells you nothing about the gap you are timing —
   how long since the last flicker, how long a reboot really costs, how long
   she has been out of sight. This is the stopwatch for all of that. */
#shiftTimer{font-size:13px; letter-spacing:.2em; color:#8fe0b4; margin-top:4px;
  font-variant-numeric:tabular-nums}
/* The air has no gauge. You are told it is failing by a sound, and you either
   recognise it or you do not. */
#alerts{position:absolute; top:78px; left:26px; font-size:10px; letter-spacing:.14em; line-height:2.2}
#alerts div{color:var(--alarm)}
#alerts div.warn{color:var(--amber)}

/* ---- controls ---------------------------------------------------------- */
.dock{position:absolute; bottom:0; z-index:45; pointer-events:auto;
  padding:14px 0 20px; width:190px; font-size:11px; letter-spacing:.2em; cursor:pointer;
  color:#8fe0b4; background:rgba(6,10,7,.94); border:1px solid #46614f; border-bottom:none;
  transition:color .1s, padding .12s}
.dock:hover:not(:disabled){color:var(--phos); padding-bottom:26px}
.dock:disabled{opacity:.3; cursor:not-allowed}
.dock.engaged{color:var(--shell); background:var(--phos); border-color:var(--phos)}
#monBtn{left:50%; transform:translateX(-50%)}
#panelBtn{right:26px}
#powerBtn{left:26px; border-color:#4a3232; color:#9a6a5a}
#powerBtn:hover{color:var(--alarm); border-color:var(--alarm)}
#powerBtn.cut{background:var(--alarm); color:#0a0d0b; border-color:var(--alarm)}
body.camsup #powerBtn{opacity:0; pointer-events:none}
.dock{transition:opacity .14s, color .1s, padding .12s}

/* ---- screens ----------------------------------------------------------- */
.screen{position:absolute; inset:0; z-index:70; display:none; flex-direction:column;
  align-items:center; justify-content:center; background:var(--shell);
  text-align:center; overflow-y:auto; -webkit-overflow-scrolling:touch;
  gap:clamp(8px,2.2vh,22px);
  padding:clamp(14px,3vh,32px) clamp(16px,4vw,40px);
}
/* centred content taller than the screen clips its own top and becomes
   unreachable; safe centring falls back to the start edge instead */
@supports (justify-content:safe center){ .screen{justify-content:safe center} }

/* A landscape phone gives about 480px of height. The title card has to fit
   inside that with room to spare, or the start button ends up below the fold
   on whichever device has one more toolbar than you tested against. */
@media (max-height:620px){
  .screen h1{font-size:clamp(18px,min(5vw,8.5vh),40px); letter-spacing:.14em}
  .screen p{font-size:clamp(9px,1.5vh,11px); line-height:1.7; max-width:70ch}
  .keys{font-size:clamp(7px,1.05vh,8px); line-height:1.75}
  .screen{gap:clamp(6px,1.6vh,14px); padding:clamp(10px,2vh,20px) clamp(14px,3vw,30px)}
  .screen button{padding:clamp(11px,1.9vh,14px) clamp(26px,6vw,38px); margin-top:2px}
}
.screen.show{display:flex}
.screen h1{font-size:clamp(20px,min(6.5vw,11vh),60px); font-weight:400;
  letter-spacing:.18em; line-height:1.12}
.screen p{font-size:clamp(10px,min(1.6vh,12px),12px); letter-spacing:.09em;
  color:var(--phos-dim); max-width:62ch; line-height:1.85}
/* Pick a night. Six small buttons rather than a dropdown, because the whole
   interface is buttons and a select element would look like it wandered in
   from a different program. */
/* Hidden until you ask for it with N, so a first-time player just clocks in. */
.nights{display:none; gap:6px; align-items:center}
body.pickNights .nights{display:flex}
.nights span{font-size:9px; letter-spacing:.24em; color:var(--phos-dim); margin-right:6px}
.hintN{font-size:8px; letter-spacing:.22em; color:rgba(99,185,142,.55)}
body.pickNights .hintN{display:none}
/* Specificity, not decoration: `.screen button` is the big filled CLOCK IN
   button and matches these too, at equal weight and later in the file — so
   every night came out full-width and phosphor-filled and you could not see
   which one was selected. Qualifying with .screen puts these back on top. */
.screen .nights button{
  font:inherit; font-size:clamp(10px,1.6vh,12px); letter-spacing:.06em;
  width:clamp(30px,4.4vh,38px); height:clamp(30px,4.4vh,38px); margin:0; padding:0;
  cursor:pointer; color:#8fe0b4; background:rgba(6,10,7,.9); border:1px solid #46614f;
}
.screen .nights button:hover{color:var(--phos); border-color:var(--phos-dim)}
.screen .nights button.on{background:var(--phos); color:var(--shell); border-color:var(--phos)}

.screen button{font-size:clamp(10px,1.7vh,12px); letter-spacing:.22em; margin-top:4px;
  padding:clamp(12px,2.2vh,16px) clamp(30px,7vw,44px); flex:none;
  cursor:pointer; color:var(--shell); background:var(--phos); border:none}
.keys{font-size:clamp(7px,min(1.15vh,9px),9px); letter-spacing:.13em;
  color:var(--phos-dim); line-height:1.9}

#scare{z-index:90; background:#000; padding:0; gap:0; overflow:hidden}
/* THE FACE IS THE PICTURE. EVERYTHING HERE PROTECTS THE TOP OF IT.

   A window wider than the frame crops the height, and object-position decides
   which band survives. At 44% it took the crop off the top, which is the one
   place there is something to lose — the head. At 18% the crop comes off the
   torso instead, where there is nothing to see. The frames themselves carry
   about 9% headroom, so the shake has room to move without ever reaching the
   scalp. */
#scare img{width:100%; height:100%; object-fit:cover; object-position:center 18%; will-change:transform}
/* The shake stays inside a 4% overscan and only ever pushes the picture DOWN,
   so no edge of the stage is exposed and the face cannot ride up out of shot. */
#scare.show img{animation:violent .07s steps(2) infinite}
@keyframes violent{0%{transform:translate(0,6px) scale(1.04)}25%{transform:translate(-12px,14px) scale(1.04)}
  50%{transform:translate(10px,4px) scale(1.04)}75%{transform:translate(-7px,9px) scale(1.05)}
  100%{transform:translate(8px,15px) scale(1.04)}}

.ph{width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  background:repeating-linear-gradient(45deg,#0e130f 0 11px,#141a15 11px 22px);
  border:1px dashed var(--phos-dim); color:var(--phos-dim); font-size:11px;
  letter-spacing:.14em; text-align:center; padding:16px; line-height:1.9}

/* ---- phone ---------------------------------------------------------------
   The touch handlers already exist; these are the things a phone needs that a
   trackpad does not — room for the notch, a power control you can hit without
   aiming, and a floorplan measured against screen HEIGHT, because a landscape
   phone has plenty of width and almost no height. */
body.touch{
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
/* Insets go on the controls, never on the page. Padding the body pushed the
   whole 100vh stage down and clipped everything along the bottom edge — which
   is where the start button lives. */
body.touch #powerBtn{ left:calc(16px + env(safe-area-inset-left));
                      bottom:calc(16px + env(safe-area-inset-bottom)); }
body.touch #audioBtn{ left:calc(126px + env(safe-area-inset-left));
                      bottom:calc(18px + env(safe-area-inset-bottom)); }
body.touch #sensorBtn{left:calc(126px + env(safe-area-inset-left));
                      bottom:calc(76px + env(safe-area-inset-bottom)); }
body.touch #map{ right:calc(12px + env(safe-area-inset-right));
                 bottom:calc(12px + env(safe-area-inset-bottom)); }
body.touch #clock{ right:calc(16px + env(safe-area-inset-right));
                   top:calc(10px + env(safe-area-inset-top)); }
body.touch #alerts{left:calc(16px + env(safe-area-inset-left));
                   top:calc(56px + env(safe-area-inset-top)); }
body.touch #camLabel{left:calc(16px + env(safe-area-inset-left)); }
body.touch #officeScene{transition:none}      /* a finger should not lag */

/* POWER is the only timed action, so it is the only round one */
body.touch #powerBtn{
  left:16px; bottom:16px; width:96px; height:96px; padding:0;
  border-radius:50%; font-size:10px; line-height:1.4; letter-spacing:.1em;
  display:flex; align-items:center; justify-content:center; text-align:center;
  border:2px solid #7a4a44; background:rgba(34,12,10,.94); color:#ffb0a6;
}
body.touch #powerBtn:hover{padding:0}
body.touch #powerBtn.cut{background:var(--alarm); color:#0a0d0b; border-color:var(--alarm)}

body.touch #audioBtn{left:126px; bottom:18px}
body.touch #sensorBtn{left:126px; bottom:76px}

body.touch #map{width:auto; right:12px; bottom:12px; padding:9px}
body.touch #mapPlan{height:min(54vh,290px); width:auto; aspect-ratio:662/776}
body.touch #map h4{font-size:8px; margin-bottom:6px}
body.touch .room i{font-size:7px}

body.touch #clock{font-size:19px; top:10px; right:16px}
body.touch #shiftTimer{font-size:11px; margin-top:3px}
body.touch body.touch #alerts{top:56px; left:16px; font-size:9px; line-height:1.9}
body.touch #commitBox{top:12px; padding:8px 12px}
body.touch #commitBar{width:160px}
body.touch #camLabel{left:16px; bottom:120px}
body.touch #panel{width:min(340px,76vw); padding:20px 16px}

/* The panoramas are 3:1. Portrait cannot show enough of one to play. */
#rotate{
  position:absolute; inset:0; z-index:95; display:none;
  flex-direction:column; align-items:center; justify-content:center; gap:16px;
  background:var(--shell); text-align:center; padding:30px;
}
#rotate i{font-size:38px; font-style:normal; animation:tip 2.4s ease-in-out infinite}
#rotate b{font-size:14px; letter-spacing:.24em; font-weight:400; color:var(--phos)}
#rotate span{font-size:11px; letter-spacing:.13em; color:#8ab8a0; line-height:2; max-width:32ch}
@keyframes tip{50%{transform:rotate(90deg)}}
@media (orientation:portrait){ body.touch #rotate{display:flex} }

@media (prefers-reduced-motion: reduce){
  #static,#camLabel .rec,#scare.show{animation:none}
  #crt{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 50%,rgba(0,0,0,.8) 100%)}
}
/* On a touch screen the pull tab is a real, permanent handle rather than a
   hover hint, and the controls grow to finger size. */
body.touch #pullTab{opacity:.5}
body.touch.camsup #pullTab{opacity:0}
body.touch .dock{width:132px; font-size:11px; padding:16px 0 22px}
body.touch #audioBtn, body.touch #sensorBtn{padding:15px 20px; font-size:12px}
body.touch .camPin{min-width:52px; padding:10px 8px; font-size:12px}
body.touch .rebootBtn{padding:16px; font-size:12px}

@media (max-width:700px){
  #clock{font-size:20px; top:14px; right:16px}
  #shiftTimer{font-size:11px}
  #alerts{top:64px; left:16px}
  .dock{width:118px; font-size:9px; letter-spacing:.12em}
  #map{width:52vw; right:12px; bottom:12px}
}
</style>
</head>

<body>
<div id="stage">

  <div id="officeView">
    <div id="officeScene">
      <div id="officeArt"></div>
      <div class="doorway left"  id="doorLeft"><img class="lurker" alt=""></div>
      <div class="doorway right" id="doorRight"><img class="lurker" alt=""></div>
      <div id="darkVeil"></div>
  <div id="pullTab"><span>▲</span></div>
    </div>
  </div>

  <div id="monitor">
    <div id="camFeed"><div id="camBox">
      <div id="camPan"><div id="camArt"></div></div>
    </div></div>
    <div id="static"></div>
    <img id="phantomArt" alt="">
    <div id="camDead">CAMERA SYSTEM OFFLINE</div>
  </div>

  <!-- The monitor's controls, lifted out of the monitor so the CRT vignette
       grades the footage and leaves the interface alone. Same rectangle, same
       offsets, same slide — see #monUI. -->
  <div id="monUI">
    <div id="camLabel"><span class="rec">●REC</span><span id="camName"></span></div>
    <button id="audioBtn">PLAY AUDIO CUE &nbsp;[F]</button>
    <button id="sensorBtn">MOUNT SENSOR &nbsp;[M]</button>
    <div id="map">
      <div id="mapPlan"></div>
    </div>
  </div>

  <!-- Lives outside the monitor. Inside it, the monitor's own transform and
       pointer-events:none took the panel with it and nothing ever appeared. -->
  <div id="panel">
    <h3>MAINTENANCE PANEL</h3>
    <div id="sysList"></div>
    <button class="rebootBtn" id="rebootAll">REBOOT ALL SYSTEMS</button>
  </div>

  <div id="hud">
    <div id="clock"><span id="clockHour">12 AM</span>
      <small id="shiftTimer">00:00</small>
      <small id="nightLabel">NIGHT 1</small></div>
    <div id="alerts"></div>
  </div>

  <button class="dock" id="powerBtn">CUT POWER &nbsp;[X]</button>
  <button class="dock" id="monBtn">MONITOR &nbsp;[SPACE]</button>
  <button class="dock" id="panelBtn">PANEL &nbsp;[C]</button>

  <div class="screen show" id="titleScreen">
    <h1>WELCOME TO THE<br>NIGHT SHIFT</h1>
    <div class="hintN">press N to choose a night</div>
    <div class="nights" id="pickTitle"></div>
    <button id="btnStart">CLOCK IN</button>
  </div>

  <div class="screen" id="loseScreen">
    <h1>SHIFT ENDED</h1>
    <p id="loseNote"></p>
    <div class="nights" id="pickLose"></div>
    <button id="btnRetry">CLOCK IN</button>
  </div>

  <div class="screen" id="winScreen">
    <h1>6 AM</h1>
    <p id="winNote"></p>
    <div class="nights" id="pickWin"></div>
    <button id="btnNext">CLOCK IN</button>
  </div>

  <div class="screen" id="scare"><img id="scareArt" alt=""></div>
  <div id="outOverlay"><span>&nbsp;</span></div>
  <div id="rotate">
    <i>▯</i><b>TURN THE PHONE</b>
    <span>The building was photographed in panorama. Sideways is the only way
    you see enough of it to survive.</span>
  </div>

  <div id="crt"></div>
</div>

<script>
"use strict";

/* ===========================================================================
   1. THE BUILDING
   Coordinates are percentages of your floorplan image, so they line up with
   the sketch exactly. Edges only need to be listed once — the reverse is
   generated automatically, which is one less thing to get wrong.
   =========================================================================== */

const OFFICE_AT = { x:40.0, y:58.8 };

const GRAPH = {
  // spawn nodes, outside the building. No camera covers these on purpose.
  gW:{ x:6.9,  y:12.9, edges:["n04"], outside:true },
  gE:{ x:92.9, y:16.4, edges:["n22"], outside:true },
  gS:{ x:67.5, y:99.0, edges:["n19"], outside:true },

  // --- north rooms, each opening onto the north hall ---
  n01:{ x:26.6, y:10.3, edges:["n20"] },
  n02:{ x:50.0, y:10.3, edges:["n05"] },
  n03:{ x:71.0, y:10.6, edges:["n21"] },

  // --- north hall ---
  n04:{ x:17.0, y:16.5, edges:["n20"] },                  // west end
  n20:{ x:30.0, y:16.2, edges:["n05"] },                  // outside NW room
  n05:{ x:50.0, y:17.7, edges:["n21","n07"] },            // outside N room
  n21:{ x:70.0, y:17.0, edges:["n22"] },                  // outside NE room
  n22:{ x:85.0, y:16.5, edges:["n08"] },                  // east end

  // --- second tier. 06 and 09 are dead-end pockets off the center room. ---
  n06:{ x:33.1, y:22.9, edges:["n07"] },                  // upper annex   (NO CAMERA)
  n07:{ x:46.4, y:33.2, edges:["n09","n11"] },            // center room
  n08:{ x:79.2, y:22.4, edges:[] },                       // east closet
  n09:{ x:75.5, y:32.9, edges:[] },                       // east gallery  (NO CAMERA)

  // --- the center hall ---
  // north end: the junction for the north office and the east wing
  n11:{ x:48.6, y:43.0, edges:["nDL","n12","n10"] },

  // THE TWO SQUARES THAT MATTER. Directly left and right of your door, and
  // the last place anything stands before it reaches you.
  nDL:{ x:48.6, y:54.0, edges:["nDR","OFFICE"] },         // hall, LEFT of your door
  nDR:{ x:48.8, y:64.0, edges:["n14","n15","OFFICE"] },   // hall, RIGHT of your door

  // south end: the junction for the south office, the dock and the south hall
  n14:{ x:49.2, y:74.0, edges:["n15","n16","n17","n18"] },

  // --- the two offices flanking yours. Reached from the hall's two ends, so
  //     something in here is close, but not yet beside you. ---
  n10:{ x:39.4, y:44.2, edges:[] },                       // NORTH OFFICE
  n16:{ x:39.7, y:73.5, edges:[] },                       // SOUTH OFFICE

  // --- east wing ---
  n12:{ x:57.4, y:39.0, edges:["n13"] },
  n13:{ x:57.1, y:54.8, edges:[] },                       // dead end off 12
  n15:{ x:58.9, y:65.1, edges:[] },                       // between DR and 14
  n17:{ x:62.7, y:77.7, edges:[] },                       // dead end off 14

  // --- south hall, now a loop back to the dock end ---
  n25:{ x:33.0, y:85.0, edges:["n18","n19"] },
  n18:{ x:49.8, y:84.8, edges:["n19"] },
  n19:{ x:64.2, y:92.5, edges:[] },

  OFFICE:{ x:OFFICE_AT.x, y:OFFICE_AT.y, edges:[] }
};

/* Cameras.

   sees      nodes this feed covers properly
   peek      nodes it can only just make out — small, dim, at the frame edge
   unstable  a failing feed. Constant dropout, and the motion sensor will not
             hold on it. This is deliberately the ONE camera that looks at the
             two squares beside your door: the thing you most want to check is
             the thing you can least rely on. Your warning comes instead from
             the two ordinary cameras in the offices either side of yours.
   pan       width comes from each photo's real aspect ratio. 102 means the
             photo isn't wide enough to sweep, so it reads as a fixed camera.
*/
const CAMERAS = {
  C01:{ name:"1A  NORTH-WEST ROOM", pin:{x:36.3,y:8.7},  sees:["n01"],
        art:"images/cam_01.jpg", pan:{width:102,period:34000,phase:0.0} },
  C02:{ name:"1B  NORTH ROOM",      pin:{x:60.1,y:8.8},  sees:["n02"],
        art:"images/cam_02.jpg", pan:{width:102,period:29000,phase:1.7} },
  C03:{ name:"1C  NORTH-EAST ROOM", pin:{x:80.7,y:8.7},  sees:["n03"],
        art:"images/cam_03.jpg", pan:{width:131,period:37000,phase:3.1} },
  // gW is outside the building — visible from the hall camera through the
  // west end, so you can watch one arrive before it is even indoors
  C04:{ name:"2A  NORTH HALL",      pin:{x:81.7,y:16}, sees:["gW","n04","n20","n05","n21","n22"],
        art:"images/cam_04.jpg", pan:{width:102,period:44000,phase:0.8} },
  C05:{ name:"2B  CENTER ROOM",     pin:{x:54.7,y:32}, sees:["n07"],
        art:"images/cam_05.jpg", pan:{width:132,period:31000,phase:2.2} },
  C06:{ name:"2C  EAST CLOSET",     pin:{x:80,y:26.3}, sees:["n08"],
        art:"images/cam_06.jpg", pan:{width:102,period:26000,phase:4.4} },

  // the one you need and cannot trust
  C07:{ name:"3A  OFFICE HALL",     pin:{x:50,y:42.9}, sees:["n11","nDL","nDR","n14","n18"],
        unstable:true,
        art:"images/cam_07.jpg", pan:{width:102,period:39000,phase:5.0} },

  C08:{ name:"3B  NORTH OFFICE",    pin:{x:39.2,y:47}, sees:["n10"], peek:["nDL"],
        art:"images/cam_08.jpg", pan:{width:162,period:28000,phase:1.1} },
  C09:{ name:"4A  EAST WING",       pin:{x:64,y:54.6}, sees:["n12","n13"],
        art:"images/cam_09.jpg", pan:{width:149,period:41000,phase:2.9} },
  C10:{ name:"4B  EAST STORE",      pin:{x:64.3,y:66}, sees:["n15"],
        art:"images/cam_10.jpg", pan:{width:122,period:33000,phase:0.4} },
  C11:{ name:"4C  EAST DOCK",       pin:{x:64.2,y:79.4}, sees:["n17"],
        art:"images/cam_11.jpg", pan:{width:125,period:30000,phase:3.6} },
  C12:{ name:"5A  SOUTH OFFICE",    pin:{x:38.9,y:79.3}, sees:["n16"], peek:["nDR"],
        art:"images/cam_12.jpg", pan:{width:137,period:27000,phase:5.4} },
  C13:{ name:"6A  SOUTH HALL",      pin:{x:49.7,y:86}, sees:["n25","n18","n19"],
        art:"images/cam_13.jpg", pan:{width:123,period:43000,phase:2.0} }
};

/* Where the door actually is in office.jpg, as percentages of the panorama.
   Measured off the photo: the frame runs x 36.3-44.3, its head beam sits at
   y 36.5, and the floor is hidden behind the monitor at about y 50.5 — so a
   figure standing there shows head and shoulders and nothing else. */
const OFFICE_DOOR = { x:39.4, w:5.6, top:39.3, h:12 };

const OFFICE_ART   = "images/office.jpg";
const FLOORPLAN_ART= "images/floorplan.png";

/* ---------------------------------------------------------------------------
   WHERE A BODY STANDS IN EACH SHOT

   Placement is per NODE, not per camera, because a camera that covers two
   nodes is looking at two different parts of the room — C04 sees both ends of
   the north hall and they are nowhere near each other in the panorama.

   left/bottom/width are percentages of the FULL panorama, not the screen, so
   a figure stays nailed to its spot while the camera sweeps past it.
   flip:true mirrors the sprite so it faces into the room.
   dim scales brightness — use it for nodes far from the lens.

   Tune these once per photo, with the game running. Anything missing falls
   back to DEFAULT_SHOT, which is centre-frame and will look wrong on purpose
   so you notice it.
--------------------------------------------------------------------------- */
/* clipT/R/B/L cut percentages off each edge of the sprite, so a figure can sit
   behind a desk, be swallowed by a door frame, or lean out from a wall showing
   only half of itself. Cropping happens in the sprite's own space, so it holds
   as the camera sweeps. */
const DEFAULT_SHOT = { left:42, bottom:12, width:16, flip:false, dim:1,
                       clipT:0, clipR:0, clipB:0, clipL:0 };

/* Calibrated in the tool against the real photographs.

   Note n18: it is the only node two cameras look at from genuinely different
   places — the far end of a corridor on C07, the middle of the room on C13 —
   so it carries one entry per camera and no plain one. A plain "n18" would
   mean "n18 as C07 sees it" and would quietly drive C13 as well, which is how
   the south hall framing was lost once already. Same in SHOTS_UNIT.

   This note lives ABOVE the block rather than inside it because the
   calibration tool regenerates everything between the braces on write. */
const SHOTS = {
  n01 :{ left:40, bottom:14, width:17 },
  n02 :{ left:44, bottom:14, width:17 },
  n03 :{ left:38, bottom:14, width:17, flip:true },
  n04 :{ left:10, bottom:22, width:10, dim:0.7 },
  n20 :{ left:26, bottom:20, width:12, dim:0.8 },
  n05 :{ left:44, bottom:17, width:15 },
  n21 :{ left:62, bottom:15, width:18 },
  n22 :{ left:76, bottom:13, width:21 },
  n06 :{ left:36, bottom:13, width:18 },
  n07 :{ left:46, bottom:14, width:17 },
  n08 :{ left:44, bottom:12, width:20 },
  n09 :{ left:40, bottom:15, width:16 },
  nDR :{ left:42, bottom:12, width:65.9 },
  nDL :{ left:33, bottom:22, width:18 },
  n14 :{ left:36, bottom:32, width:12, dim:0.8 },
  n11 :{ left:38, bottom:40, width:8, dim:0.7 },
  n10 :{ left:44, bottom:12, width:19 },
  n16 :{ left:42, bottom:12, width:19, flip:true },
  n12 :{ left:24, bottom:20, width:13, dim:0.8 },
  n13 :{ left:58, bottom:14, width:18, flip:true },
  n15 :{ left:42, bottom:14, width:17 },
  n17 :{ left:38, bottom:16, width:16 },
  n25 :{ left:18, bottom:20, width:12, dim:0.8 },
  n19 :{ left:62, bottom:14, width:18, flip:true },
  gW  :{ left:31, bottom:54.1, width:2.8, flip:true, dim:0.55, clipR:36, clipB:54, clipL:38 },
  "n18@C07":{ left:42, bottom:12, width:16 },
  "n18@C13":{ left:41.5, bottom:23, width:7.5 }
};

/* ---------------------------------------------------------------------------
   PER-ANIMATRONIC PLACEMENT

   SHOTS above is the shared placement for a node — where a body stands in that
   shot. Anything listed here overrides it for one animatronic only, so the two
   of them can occupy a room differently: the Warden filling a doorway head-on
   while the Auditor hangs back against the far wall, or one crowding the lens
   in the hall while the other keeps its distance.

   Only the keys you name are overridden; everything else falls through to
   SHOTS. Leave a unit's object empty to have it use the shared placement
   everywhere. The calibration tool writes this block for you.
--------------------------------------------------------------------------- */
const SHOTS_UNIT = {
  warden: {
    nDR :{ left:42, bottom:12, width:16, clipL:2 },
    nDL :{ left:40.3, bottom:3.9, width:14 },
    n01 :{ left:3.9, bottom:-24.6, width:26.2 },
    n02 :{ left:-5.1, bottom:-56.9, width:31.6 },

/* ---------------------------------------------------------------------------
   THE AUDITOR'S COMMITMENT

   She does not run on a countdown. When she reaches a doorway a meter starts:
   it rises while you are NOT watching her and falls while you are. Fill it and
   she comes in. Drain it past zero and she goes away.

   The power cut does nothing to her. Watching is the only thing that does, and
   watching costs you everything else you could be doing with those seconds —
   which is the entire reason to open the cameras at all.

   A camera fault gives no protection: the meter keeps rising because you still
   cannot watch her. The answer is to reboot the array and then hold her, which
   has to fit inside killMs. Simulated at 6.8s to reboot plus 4s to hold,
   against 15s on night one down to 10s on night six.

   Verified by simulation over 6000 nights per configuration:
     a player who never opens the cameras dies on 100% of nights, every night
     a competent player survives 89% of night 1 falling to 46% of night 6
     and spends roughly 60% of the night holding a feed
--------------------------------------------------------------------------- */
/* Staring at one feed forever was the whole optimal strategy, so it stops
   working. Hold a unit on screen and its stall decays; look away and it
   recovers. You cannot park on her — you can only buy stretches of time, and
   the price of each one is going and doing something else in between. */
const FATIGUE = {
  fullMs:   9000,   // continuous watching before the stall is at its weakest
  floor:    0.28,   // how much of the stall survives at that point
  recover:  1.7     // how much faster it comes back than it wore off
};

const AUDITOR = {
  /* Reaching a doorway is still a crisis. She stands there for a moment first,
     but an aimed audio cue gives one last chance: if she takes it, she leaves
     immediately. The Warden never gets this doorway escape. She can still
     ignore a cue, so prevention and watching remain the safer answers. */
  /* How long she stands there first. Enough to react once — find the feed,
     aim it, fire — and not enough to think about it. */

  /* HER PACE. This is the number that decides whether she is a threat at all.

     It multiplies the night's move interval, and it also carries her rhythm
     of 1.27, so 6.5 meant a step every 39 SECONDS on night six — around seven
     for the whole night, against seven rooms of building to cross, before the
     watch stall slowed her further. A player who watched her at all could
     finish night six having seen her move once. She was not slow, she was
     stationary.

     It now tightens across the week instead of loosening, and it is set
     against her entry time below: she walks in far sooner than she used to, so
     the interval could come back up a little without giving her the night
     back. Measured over 120 nights per figure, against a player who never
     plays a cue:

                                    night 1      night 3      night 6
       watching her half the night  0.2 knocks   0.9 knocks   2.4 knocks
       never watching her           0.7 knocks   1.7 knocks   3.7 knocks

     The gap between those two rows is the whole point of the character: what
     watching buys you, and what ignoring her costs. The autopilot, which
     watches, cues her out on sight and answers the door, survives 100 · 80 ·
     63 · 55 · 38 · 18 percent across the six nights, 40 nights each — where
     before these numbers it could finish night six having seen her move
     once. */

  approach: 0.95,

function auditorCfg(){
  const h = nightIdx();
  return { doorMs:AUDITOR.doorMs[h], moveMult:AUDITOR.moveMult[h] };

/* THE NIGHT GETS WORSE AS IT GOES.

   Applied per in-game hour elapsed, so 5AM is meaningfully harder than 12AM on
   every night. This is what stops a night from being one difficulty repeated
   six times — the shape of the pressure is what you remember. */
const RAMP = { approach:0.035, idle:0.030, moveMs:0.035 };

/* The night's numbers with the hour's ramp already folded in. Everything that
   reads difficulty goes through here, never NIGHTS directly. */
function tuned(){
  const n = night(), h = Math.min(5, S.hour);
  return {
    moveMs:     n.moveMs * Math.pow(1 - RAMP.moveMs, h),
    approach:   Math.min(0.95, n.approach + RAMP.approach * h),
    idleChance: Math.max(0, n.idleChance - RAMP.idle * h),
    doubleStep: n.doubleStep,
    breachMs:   n.breachMs,
    respiteMs:  n.respiteMs
  };
}

  /* One system on the early nights, two once you know what he is. The camera
     system is always one of them: he came in through it. */
  extraFaultFrom: 3
};

const SYSTEMS = [
  { id:"cam",   name:"CAMERA SYSTEM" },
  { id:"audio", name:"AUDIO RELAY" },
  { id:"vent",  name:"VENTILATION" }
];

/* ===========================================================================
   3. GRAPH MATH — symmetry, distances, pathing
   =========================================================================== */

const ADJ = {};
Object.keys(GRAPH).forEach(k => ADJ[k] = new Set(GRAPH[k].edges || []));
Object.keys(GRAPH).forEach(k => (GRAPH[k].edges || []).forEach(e => {
  if (!ADJ[e]) { console.warn("edge to unknown node:", e); return; }
  ADJ[e].add(k);                                   // make every edge two-way
}));
Object.keys(ADJ).forEach(k => ADJ[k] = [...ADJ[k]]);

function bfs(start){
  const d = { [start]:0 }, q = [start];
  while (q.length){
    const c = q.shift();
    for (const nb of ADJ[c]) if (d[nb] === undefined){ d[nb] = d[c] + 1; q.push(nb); }
  }
  return d;
}

const DO = bfs("OFFICE");                          // distance from your office
const DIST_CACHE = {};
function distFrom(node){ return DIST_CACHE[node] || (DIST_CACHE[node] = bfs(node)); }

// which nodes nobody can see — a real feature of the floorplan, not a bug
const BLIND = Object.keys(GRAPH).filter(n =>
  !GRAPH[n].outside && n !== "OFFICE" &&
  !Object.values(CAMERAS).some(c => c.sees.includes(n)));

const DOORS   = ADJ["OFFICE"];                     // nodes that open onto you
const SPAWNS  = Object.keys(GRAPH).filter(n => GRAPH[n].outside);

const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffled(a){
  const out = [...a];
  for (let i = out.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}
const walkable = n => n !== "OFFICE" && !GRAPH[n].outside;

/* ===========================================================================
   4. ART LOADING — every missing file names itself
   =========================================================================== */

/* Once the panorama is decoded, tell the scene its real shape — so swapping in
   a differently proportioned photo needs no code change. */
function fitOfficeScene(img){
  if (!img.naturalWidth) return;
  el.officeScene.style.aspectRatio = img.naturalWidth + "/" + img.naturalHeight;
}

function mountArt(container, src, note){
  container.innerHTML = "";
  const img = new Image();
  img.alt = "";
  img.style.cssText = "width:100%;height:100%;object-fit:cover;display:block";
  img.onerror = () => container.innerHTML =
    '<div class="ph">NO SIGNAL<br>' + src + (note ? "<br>" + note : "") + "</div>";
  img.src = src;
  container.appendChild(img);
  return img;
}

phantomSprite.dataset.ok = "0";

ROSTER.forEach(a => {

   =========================================================================== */

function initAudio(){
  if (actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  master = actx.createGain(); master.gain.value = 1; master.connect(actx.destination);

  // camera hiss, always synthesized
  const buf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = actx.createBufferSource(); src.buffer = buf; src.loop = true;

  /* Room tone for a monitor, not a burst of white noise. The bright band that
     made the old hiss abrasive is rolled off above 1.1k, the rumble below 160
     is cut so it doesn't muddy the footsteps, and the level sits well under
     everything else — it should be something you stop noticing. */
  const hp = actx.createBiquadFilter();
  hp.type = "highpass"; hp.frequency.value = 160;
  const lp = actx.createBiquadFilter();
  lp.type = "lowpass";  lp.frequency.value = 1100; lp.Q.value = .3;
  const tilt = actx.createBiquadFilter();
  tilt.type = "peaking"; tilt.frequency.value = 3200; tilt.gain.value = -14; tilt.Q.value = .7;

  hiss = actx.createGain(); hiss.gain.value = 0;
  src.connect(hp).connect(lp).connect(tilt).connect(hiss).connect(master);
  src.start();

  /* THE AIR.

     What the office sounds like when you are sitting in it: moving air and the
     blade of the fan under it, low enough to stop hearing after a minute. It
     belongs to the room, so it plays while you are IN the room — raise the
     cameras and the monitor's own hiss takes over instead.

     It is also the ventilation telling you it is alive. When that system
     faults the hum stops, and the silence arrives a good while before the
     alarm does. */
  const vsrc = actx.createBufferSource(); vsrc.buffer = buf; vsrc.loop = true;
  const vhp = actx.createBiquadFilter();
  vhp.type = "highpass"; vhp.frequency.value = 46;
  const vlp = actx.createBiquadFilter();
  vlp.type = "lowpass";  vlp.frequency.value = 200; vlp.Q.value = .5;
  vent = actx.createGain(); vent.gain.value = 0;
  vsrc.connect(vhp).connect(vlp).connect(vent).connect(master);
  vsrc.start();
  // a faint blade under the air, so it reads as machinery rather than as noise
  const vosc = actx.createOscillator(), vog = actx.createGain();
  vosc.type = "triangle"; vosc.frequency.value = 61; vog.gain.value = .085;
  vosc.connect(vog).connect(vent); vosc.start();

  // try to load every file; silence on failure is fine, the synth covers it
  Object.entries(SFX).forEach(([name, def]) => {
    fetch(def.src)
      .then(r => r.ok ? r.arrayBuffer() : Promise.reject())
      .then(b => actx.decodeAudioData(b))
      .then(buf => { buffers[name] = buf; })
      .catch(() => {/* no file, synth handles it */});
  });
}

const setHiss = on => hiss && hiss.gain.setTargetAtTime(on ? .018 : 0, actx.currentTime, .14);
/* Slower than the hiss on purpose. Air takes a moment to stop moving, and a
   hum that snapped off would read as a sound effect rather than as a room. */
const setVentHum = on => vent && vent.gain.setTargetAtTime(on ? .052 : 0, actx.currentTime, .55);

/* Play a named cue. opts: {vol, pan, rate} */
function play(name, opts){
  if (!actx) return;
  const def = SFX[name]; if (!def) return;
  const o = opts || {};

  if (!buffers[name]){ if (def.synth) def.synth(o); return; }

  const s = actx.createBufferSource();
  s.buffer = buffers[name];
  s.playbackRate.value = o.rate || 1;
  const g = actx.createGain();
  g.gain.value = (def.vol || .5) * (o.vol === undefined ? 1 : o.vol);

  let tail = g;
  if (o.pan !== undefined && actx.createStereoPanner){
    const p = actx.createStereoPanner();
    p.pan.value = Math.max(-1, Math.min(1, o.pan));
    g.connect(p); tail = p;
  }
  s.connect(g); tail.connect(master);
  s.start();
}

/* --- synthesized fallbacks --- */
function tone(freq, dur, type, vol, slideTo){
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || "sine";
  o.frequency.setValueAtTime(freq, actx.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, actx.currentTime + dur);
  g.gain.setValueAtTime(vol || .18, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + dur);
  o.connect(g).connect(master || actx.destination);
  o.start(); o.stop(actx.currentTime + dur + .05);
}

function noise(dur, filterType, freq, vol, pan, shape){
  if (!actx) return;
  const len = Math.floor(actx.sampleRate * dur);
  const b = actx.createBuffer(1, len, actx.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < len; i++){
    const t = i / len;
    d[i] = (Math.random()*2-1) * (shape ? shape(t) : (1 - t));
  }
  const s = actx.createBufferSource(); s.buffer = b;
  const f = actx.createBiquadFilter(); f.type = filterType; f.frequency.value = freq;
  const g = actx.createGain(); g.gain.value = vol;
  let tail = g;
  if (pan !== undefined && actx.createStereoPanner){
    const p = actx.createStereoPanner(); p.pan.value = pan; g.connect(p); tail = p;
  }
  s.connect(f).connect(g); tail.connect(master || actx.destination);
  s.start();
}

const thump = (f, v) => tone(f, .13, "sine", v, f * 0.55);
const breath = () => noise(1.1, "lowpass", 300, .30, undefined, t => Math.sin(t*Math.PI)**2);
/* the Warden crossing: long, low, weighted, with a slight rise as it passes */
/* An original eight-note figure on a detuned box. Slightly flat, slightly
   uneven, and it stops one note before it resolves. */
function musicBox(){
  if (!actx) return;
  const notes = [784, 659, 523, 659, 587, 494, 440, 523];
  notes.forEach((f, i) => {
    const t = actx.currentTime + i * 0.34;
    const detune = 1 - 0.012 * Math.sin(i * 1.7);       // wow and flutter
    [0, 1].forEach(h => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = h ? "sine" : "triangle";
      o.frequency.value = f * detune * (h ? 2 : 1);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(h ? .022 : .05, t + .012);
      g.gain.exponentialRampToValueAtTime(.0001, t + (h ? .5 : .95));
      o.connect(g).connect(master || actx.destination);
      o.start(t); o.stop(t + 1.0);
    });
  });
}

const dragHeavy = () => {
  noise(1.9, "lowpass", 300, .40, undefined, t => Math.sin(t*Math.PI) ** 0.7);
  setTimeout(() => tone(74, .5, "sine", .16, 52), 420);
};
/* the Auditor crossing: shorter, drier, higher, over before you locate it */
const dragQuick = () => {
  noise(0.85, "bandpass", 1250, .30, undefined, t => Math.sin(t*Math.PI) ** 1.6);
  setTimeout(() => noise(0.4, "highpass", 2600, .16, undefined, t => 1-t), 260);
};
/* one Auditor step. Soft on purpose — a hint, not an alarm. */
const softTell = () => {
  noise(0.16, "bandpass", 900, .16, undefined, t => (1-t) ** 2);
  setTimeout(() => tone(392, .13, "triangle", .045), 40);
};
const cueChirp = () => { tone(520,.22,"triangle",.12,760); setTimeout(()=>tone(430,.3,"triangle",.1,300),200); };
/* THE FEED CHANGING.

   Three of them, because it is the sound you will hear more than any other in
   the game and the right one is a matter of taste rather than of argument.
   Change CAM_SWITCH to audition:

     "relock"  the default now. A tape head finding the new picture: a short
               downward whoop of filtered noise with a soft click under it. No
               mechanism, no clack — it belongs to the signal rather than to
               the switch, which is what everything else on the monitor sounds
               like.
     "relay"   the previous one. A contact closing, then the picture landing.
               Drier and more mechanical.
     "tick"    barely there. One damped click and a breath of tape hiss, for
               when the sweep starts to grate after an hour of play. */
const CAM_SWITCH = "relock";

const camSwitchFx = {
  /* noise swept down through a bandpass reads as the picture re-locking. The
     click is at the START, so the sound follows the button rather than
     announcing itself after it. */
  relock(){
    if (!actx) return;
    const b = actx.createBuffer(1, actx.sampleRate * 0.26, actx.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++){
      const t = i / d.length;
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 1.7);
    }
    const s = actx.createBufferSource(); s.buffer = b;
    const f = actx.createBiquadFilter();
    f.type = "bandpass"; f.Q.value = 3.2;
    f.frequency.setValueAtTime(2600, actx.currentTime);
    f.frequency.exponentialRampToValueAtTime(420, actx.currentTime + 0.22);
    const g = actx.createGain(); g.gain.value = 0.16;
    s.connect(f).connect(g).connect(master || actx.destination);
    s.start();
    tone(320, .03, "sine", .022, 190);
  },
  relay(){
    tone(184,.05,"square",.026,124);
    noise(0.14,"highpass",1900,.040,undefined,t=>(1-t)**2);
  },
  tick(){
    tone(240,.025,"sine",.020,150);
    noise(0.09,"bandpass",2400,.030,undefined,t=>(1-t)**2.5);
  }
};

const camClunk = () => (camSwitchFx[CAM_SWITCH] || camSwitchFx.relock)();
/* the few seconds before it reaches you: a rising bed of noise under a
   detuned pair of tones, so it reads as approach rather than as an alarm */
function doomSynth(){
  if (!actx) return;
  noise(3.2, "lowpass", 220, .30, undefined, t => t * t);
  [58, 61].forEach((f, i) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "sawtooth"; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.16, actx.currentTime + 2.6);
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + 3.3);
    o.connect(g).connect(master || actx.destination);
    o.start(); o.stop(actx.currentTime + 3.4);
  });
}

const screechSynth = () => {
  if (!actx) return;
  const b = actx.createBuffer(1, actx.sampleRate*1.1, actx.sampleRate);
  const d = b.getChannelData(0);
  for (let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=actx.createBufferSource(); s.buffer=b;
  const f=actx.createBiquadFilter(); f.type="bandpass"; f.Q.value=1.4;
  f.frequency.setValueAtTime(2800, actx.currentTime);
  f.frequency.exponentialRampToValueAtTime(320, actx.currentTime+1);
  const g=actx.createGain(); g.gain.value=.5;
  s.connect(f).connect(g).connect(master||actx.destination); s.start();
};

/* Named helpers used by the game, so call sites stay readable. */
const chime   = () => play("hourBell");
const clunk   = () => play("breaker");
const buzz    = () => play("fault");
const blip    = () => play("reboot");
const lureFx  = () => play("cue");
const screech = () => play("scream");

/* A footstep somewhere in the building. Quieter the further out it is, and
   panned toward whichever door that route leads to. */
function footstep(u){
  const d = DO[u.node];
  if (d === undefined || d > 4) return;
  const near = d <= 1;
  play(near ? "stepClose" : "step", {
    vol: Math.max(.12, 1 - (d - 1) * 0.26),
    pan: sideOf(u.node) === "left" ? -0.7 : 0.7,
    rate: 0.92 + Math.random() * 0.16
  });
}

function scrape(u){
  play("atDoor", { pan: u && sideOf(u.node) === "left" ? -0.6 : 0.6 });
}

   6. STATE

const S = {
  running:false, night:1, hour:0, hourAcc:0, ventHum:false,
  monUp:false, panelOpen:false, activeCam:"C04",
  power:true, powerBackAt:0,
  o2:100,
  units:[], sys:{}, lure:null, lureReadyAt:0,
  failAcc:0, lastFrame:0, raf:null, breathAcc:0, flicker:0, ambAcc:0,
  darkCamAcc:0, boxPlayed:false, ventAlarmAcc:0, transitUntil:0, hallucAcc:0,
  sensorOn:null,          // camera id the motion sensor is mounted on
  sensorAcc:0,
  passedOut:0,            // ms remaining face-down
  phantom:null,           // {at, acc} — he is on the feed right now
