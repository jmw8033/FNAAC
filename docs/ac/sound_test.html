<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FNAAC Sound Test</title><style>
:root{color-scheme:dark;--bg:#050806;--card:#0b110d;--line:#26382e;--text:#d9eee1;--dim:#789184;--accent:#8fe0b4;--amber:#ffc766}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#0d1711,#040605 55%);color:var(--text);font:13px/1.45 ui-monospace,Consolas,monospace}header{position:sticky;top:0;z-index:4;padding:18px 22px;background:rgba(5,8,6,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}h1{margin:0;font-size:18px;letter-spacing:.18em;font-weight:500}.sub{margin-top:7px;color:var(--dim);max-width:980px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}input,select,button{font:inherit;background:#08100b;color:var(--text);border:1px solid var(--line);padding:8px 10px}input{min-width:240px;flex:1}button{cursor:pointer;color:var(--accent)}button:hover{border-color:var(--accent)}#status{color:var(--amber);padding-left:4px;align-self:center}.grid{padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px}.card{background:linear-gradient(180deg,#0b110d,#080c09);border:1px solid var(--line);padding:13px;display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center}.name{font-size:14px;color:var(--accent);letter-spacing:.08em}.category{font-size:9px;color:var(--amber);letter-spacing:.12em;text-transform:uppercase}.desc{grid-column:1/2;color:#a9bdb1}.src{grid-column:1/2;color:var(--dim);font-size:10px;word-break:break-all}.play{grid-column:2;grid-row:1/5;min-width:72px;height:42px}iframe{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-20px;top:-20px}</style></head><body>
<header><h1>FNAAC SOUND TEST</h1><div class="sub">This tool calls the exact sound engine in the neighboring <code>index.html</code>/<code>game.js</code>, so synth-only effects use the same fallback synthesis as the game. If the game engine is unavailable, recorded WAV effects fall back to direct playback.</div><div class="controls"><input id="q" placeholder="Search name or description"><select id="cat"><option value="">All categories</option></select><span id="status">Loading game audio engine…</span></div></header><main id="grid" class="grid"></main><iframe id="engine" src="index.html" aria-hidden="true"></iframe>
<script>
const SOUNDS=[{"id":"step","src":"sounds/step.wav","category":"Animatronics","description":"Distant Eugene/roamer footstep heard within a few rooms."},{"id":"stepClose","src":"sounds/step_close.wav","category":"Animatronics","description":"Close roamer footstep near the office."},{"id":"atDoor","src":"sounds/at_door.wav","category":"Animatronics","description":"Breathing/scrape cue while a threat is at an office doorway."},{"id":"walkByA","src":"sounds/walk_by_eugene.wav","category":"Animatronics","description":"Eugene physically crossing past the office doorway."},{"id":"walkByB","src":"sounds/walk_by_sloppy.wav","category":"Animatronics","description":"Sloppy physically crossing past the office doorway."},{"id":"ambBox","src":"sounds/amb_musicbox.wav","category":"Ambience","description":"Random music-box room ambience; not a gameplay warning."},{"id":"ambKnock","src":"sounds/amb_knock.wav","category":"Ambience","description":"Random distant knock ambience."},{"id":"ambCreak","src":"sounds/amb_creak.wav","category":"Ambience","description":"Long building creak ambience."},{"id":"ambPipes","src":"sounds/amb_pipes.wav","category":"Ambience","description":"Low pipe / building-rumble ambience."},{"id":"ambSigh","src":"sounds/amb_sigh.wav","category":"Ambience","description":"Distant sigh-like room ambience."},{"id":"ventAlarm","src":"sounds/vent_alarm.wav","category":"Systems","description":"Ventilation warning tone as oxygen becomes urgent."},{"id":"ambDoor","src":"sounds/amb_door.wav","category":"Ambience","description":"Ambient latch / door noise with no mechanical meaning."},{"id":"ambDrip","src":"sounds/amb_drip.wav","category":"Ambience","description":"Water-drip ambience."},{"id":"ambChair","src":"sounds/amb_chair.wav","category":"Ambience","description":"Chair / weight-shift ambience."},{"id":"ambFloor","src":"sounds/amb_floor.wav","category":"Ambience","description":"Single floorboard / structural creak ambience."},{"id":"ambDistant","src":"sounds/amb_distant.wav","category":"Ambience","description":"Very distant voice-like ambience."},{"id":"tellB","src":"sounds/move_sloppy.wav","category":"Sloppy","description":"Sloppy movement sound; tells the player another watch cycle has begun."},{"id":"enterA","src":"sounds/enter_eugene.wav","category":"Eugene","description":"Eugene enters the building from outside."},{"id":"enterB","src":"sounds/enter_sloppy.wav","category":"Sloppy","description":"Sloppy enters the building from outside."},{"id":"cue","src":"sounds/audio_cue.wav","category":"Player tools","description":"Audio lure emitted from the selected camera."},{"id":"camSwitch","src":"sounds/cam_switch.wav","category":"Camera UI","description":"Camera feed relay / picture switch."},{"id":"camOpen","src":null,"category":"Camera UI","description":"Monitor raised."},{"id":"camClose","src":null,"category":"Camera UI","description":"Monitor lowered."},{"id":"panelOpen","src":null,"category":"Panel UI","description":"Maintenance panel opened."},{"id":"panelClose","src":null,"category":"Panel UI","description":"Maintenance panel closed."},{"id":"jeffreyIn","src":"sounds/jeffrey_in.wav","category":"Jeffrey","description":"Jeffrey resolves into the current camera feed."},{"id":"jeffreyHit","src":"sounds/jeffrey_hit.wav","category":"Jeffrey","description":"Jeffrey successfully damages the camera/system."},{"id":"camFault","src":"sounds/camera_fault.wav","category":"Systems","description":"Camera system failure."},{"id":"audioFault","src":"sounds/audio_fault.wav","category":"Systems","description":"Audio relay failure."},{"id":"fault","src":"sounds/fault.wav","category":"Systems","description":"Generic system fault cue."},{"id":"reboot","src":"sounds/reboot.wav","category":"Systems","description":"Short confirmation / reboot UI tone."},{"id":"breaker","src":"sounds/breaker.wav","category":"Power","description":"Main breaker / power-switch sound."},{"id":"hourBell","src":"sounds/hour.wav","category":"Clock","description":"Hour advance bell."},{"id":"scream","src":"sounds/scream.wav","category":"Jumpscares","description":"Generic jumpscare fallback."},{"id":"screamEugene","src":"sounds/scream_eugene.wav","category":"Jumpscares","description":"Eugene jumpscare sound."},{"id":"screamSloppy","src":"sounds/scream_sloppy.wav","category":"Jumpscares","description":"Sloppy jumpscare sound."},{"id":"screamJeffrey","src":"sounds/scream_jeffrey.wav","category":"Jumpscares","description":"Jeffrey jumpscare sound."},{"id":"screamGordon","src":"sounds/scream_gordon.wav","category":"Jumpscares","description":"Gordon jumpscare sound."},{"id":"sensorA","src":"sounds/sensor_eugene.wav","category":"Motion sensor","description":"Mounted sensor detects Eugene."},{"id":"sensorB","src":"sounds/sensor_sloppy.wav","category":"Motion sensor","description":"Mounted sensor detects Sloppy."},{"id":"doom","src":"sounds/doom.wav","category":"Danger","description":"Final dread cue before an unavoidable kill sequence."},{"id":"passOut","src":"sounds/pass_out.wav","category":"Ventilation","description":"Player passes out from zero oxygen."},{"id":"gordonStepConcrete","src":"sounds/gordon_step_concrete.wav","category":"Gordon","description":"Gordon footstep on concrete."},{"id":"gordonStepCarpet","src":"sounds/gordon_step_carpet.wav","category":"Gordon","description":"Gordon footstep on carpet."},{"id":"gordonStepTile","src":"sounds/gordon_step_tile.wav","category":"Gordon","description":"Gordon footstep on tile."},{"id":"gordonTell","src":"sounds/gordon_tell.wav","category":"Gordon","description":"Gordon shifts his weight roughly four seconds before moving."},{"id":"sensorC","src":"sounds/sensor_gordon.wav","category":"Motion sensor","description":"Mounted sensor detects Gordon."},{"id":"ductIn","src":"sounds/duct_in.wav","category":"Gordon / ducts","description":"Gordon begins climbing into a duct downstairs."},{"id":"ductCrawl","src":"sounds/duct_crawl.wav","category":"Gordon / ducts","description":"Gordon crawling inside a duct between floors."},{"id":"ductOut","src":"sounds/duct_out.wav","category":"Gordon / ducts","description":"Gordon exits the duct onto the upper floor."},{"id":"doorShut","src":"sounds/door_shut.wav","category":"Doors","description":"A lower-floor door closes."},{"id":"doorOpen","src":"sounds/door_open.wav","category":"Doors","description":"A lower-floor door opens."},{"id":"doorBlocked","src":"sounds/door_blocked.wav","category":"Doors","description":"Gordon hits a closed reusable door and is rejected."},{"id":"doorBreak","src":"sounds/door_break.wav","category":"Doors","description":"A one-shot door is destroyed."},{"id":"camBurn","src":"sounds/cam_burn.wav","category":"Camera system","description":"A camera feed burns out."},{"id":"powerOut","src":"sounds/power_out.wav","category":"Power","description":"Building power reaches zero."},{"id":"outageBox","src":"sounds/outage_box.wav","category":"Power outage","description":"Music-box cue during the power-out sequence."},{"id":"titleStab","src":"sounds/title_stab.wav","category":"Title screen","description":"Rare title-screen Gordon reveal / glitch stab."},{"id":"nightStart","src":"sounds/night_start.wav","category":"Title screen","description":"Clock-in transition immediately before a night begins."},{"id":"sloppyReady","src":null,"category":"Sloppy","description":"Watch requirement has reached five seconds."},{"id":"sloppyBlocked","src":null,"category":"Sloppy","description":"A movement opportunity was successfully blocked; begin watching again."},{"id":"all20Laugh","src":null,"category":"All-20","description":"Special synthesized laugh used only in 20/20/20/20 mode."},{"id":"lightsOff","src":"sounds/lights_off.wav","category":"Power","description":"Office lights switch off."},{"id":"lightsOn","src":"sounds/lights_on.wav","category":"Power","description":"Office lights switch on."},{"id":"powerWarn","src":"sounds/power_warn.wav","category":"Power","description":"Low-power warning tick."}];
const grid=document.getElementById('grid'),q=document.getElementById('q'),cat=document.getElementById('cat'),status=document.getElementById('status'),frame=document.getElementById('engine');
[...new Set(SOUNDS.map(x=>x.category))].sort().forEach(x=>{const o=document.createElement('option');o.value=o.textContent=x;cat.appendChild(o)});
function exactAPI(){try{return frame.contentWindow&&frame.contentWindow.FNAAC_SOUND_TEST}catch(_){return null}}
function render(){const query=q.value.trim().toLowerCase(),c=cat.value;grid.innerHTML='';SOUNDS.filter(x=>(!c||x.category===c)&&(!query||(x.id+' '+x.description+' '+x.category).toLowerCase().includes(query))).forEach(x=>{const d=document.createElement('article');d.className='card';d.innerHTML='<div><div class="category">'+x.category+'</div><div class="name">'+x.id+'</div></div><div class="desc">'+x.description+'</div><div class="src">'+(x.src||'Synth-only fallback; no WAV path')+'</div><button class="play">PLAY</button>';d.querySelector('button').onclick=()=>playSound(x);grid.appendChild(d)})}
async function playSound(x){const api=exactAPI();if(api){try{api.play(x.id);status.textContent='Played through exact game engine: '+x.id;return}catch(e){console.warn(e)}}if(x.src){try{const a=new Audio(x.src);await a.play();status.textContent='Played recorded asset directly: '+x.id;return}catch(e){console.warn(e)}}status.textContent='Could not play '+x.id+'. Open through the same local/server folder as index.html.'}
q.oninput=cat.onchange=render;frame.addEventListener('load',()=>setTimeout(()=>{status.textContent=exactAPI()?'Exact game audio engine ready.':'Game iframe loaded; direct WAV fallback will be used if engine access is blocked.'},500));render();
</script></body></html>
