<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#152a32"><title>Tank Frontier · FNAAC</title><link rel="stylesheet" href="./style.css"></head>
<body><header><a href="../../" class="brand">FNAAC</a><h1>Tank Frontier</h1><span class="edition">ALPHA</span><nav aria-label="Game controls"><a href="../">Online game</a><button id="map-button">Map <kbd>M</kbd></button><button id="pause-button">Pause</button><button id="save-button">Save</button><button id="export-button">Export save</button><button id="import-button">Import save</button><input type="file" id="import-file" accept="application/json,.json" hidden></nav></header>
<main><section class="field" aria-label="Game world"><canvas id="game" width="960" height="680" tabindex="0" aria-label="Tank Frontier. W and S drive; A and D turn; mouse aims; click fires; E interacts."></canvas><div class="location"><span id="location">Brindle Meadows</span><small id="safety">Brindle · Safe zone</small></div><div id="target-hint" class="interaction"></div><div class="vitals"><div><span>HULL</span><strong id="health-text">100 / 100</strong></div><meter id="health" min="0" max="100" value="100">Hull</meter><div class="weapon-row"><span id="weapon-name">Field cannon</span><span id="reload">Ready</span></div><small id="waypoint-text"></small></div><div id="pause-shade" hidden><button id="resume-button">Resume</button></div></section>
<aside><div class="wallet"><span id="town-name">Brindle</span><span><b id="coins">40</b> credits</span></div><nav class="tabs" aria-label="Character panel"><button class="selected" data-tab="gear">Equipment</button><button data-tab="skills">Skills</button><button data-tab="guide">Guide</button></nav><div id="panel-content"></div><div class="log"><small>ACTIVITY</small><div id="messages" role="status" aria-live="polite"></div></div><p id="save-status" role="status">Local save</p></aside></main>
<div class="touch-controls" aria-label="Touch controls"><button data-hold="KeyA">↶</button><button data-hold="KeyW">Forward</button><button data-hold="KeyS">Reverse</button><button data-hold="KeyD">↷</button><button id="touch-fire">Fire</button><button id="touch-interact">Interact</button><button id="touch-repair">Repair</button></div>
<footer><span><kbd>W S</kbd> drive · <kbd>A D</kbd> turn · Mouse aim · Click fire · <kbd>Space</kbd> brake · <kbd>E</kbd> interact · <kbd>R</kbd> repair · <kbd>Q</kbd> switch weapon</span></footer>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="dialog-close" aria-label="Close">×</button></div><div id="dialog-content"></div></dialog>
<script src="./data.js"></script><script src="./world.js"></script><script src="./engine.js"></script><script src="./render.js"></script><script src="./game.js"></script></body></html>
